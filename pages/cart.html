<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — ShopEase</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">🛍️ Shop<span>Ease</span></a>
      <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="cart.html" class="cart-link">
          Cart
          <span class="cart-badge" data-cart-badge>0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Your Cart</h1>
    <div id="cartContent"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 ShopEase — School Project Demo (HTML + CSS + JavaScript)</p>
    </div>
  </footer>

  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    function render() {
      const cartItems = getCartDetails();
      const container = document.getElementById("cartContent");

      if (cartItems.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>Your cart is empty.</p>
            <a href="../index.html">Continue shopping &rarr;</a>
          </div>`;
        return;
      }

      const total = getCartTotal(cartItems);

      container.innerHTML = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${cartItems
              .map(
                (item) => `
              <tr>
                <td>
                  <div class="cart-item-name">
                    <span class="cart-item-icon"><img src="${item.image}" alt="${item.name}" /></span>
                    <a href="detail.html?id=${item.id}">${item.name}</a>
                  </div>
                </td>
                <td>$${item.price.toFixed(2)}</td>
                <td>
                  <div class="qty-form">
                    <input type="number" min="0" value="${item.qty}" data-qty-id="${item.id}" />
                    <button class="btn btn-outline" onclick="updateQty(${item.id})">Update</button>
                  </div>
                </td>
                <td>$${item.subtotal.toFixed(2)}</td>
                <td>
                  <button class="btn btn-danger" onclick="removeItem(${item.id})">Remove</button>
                </td>
              </tr>`
              )
              .join("")}
          </tbody>
        </table>

        <div class="cart-summary">
          <div class="summary-box">
            <div class="summary-row">
              <span>Items</span>
              <span>${cartItems.reduce((s, i) => s + i.qty, 0)}</span>
            </div>
            <div class="summary-total">
              <span>Total</span>
              <span>$${total.toFixed(2)}</span>
            </div>
            <a href="checkout.html" class="btn btn-primary btn-block">Proceed to Checkout</a>
            <a href="../index.html" style="display:block; text-align:center; margin-top:10px; color: var(--muted); font-size: 0.85rem;">Continue shopping</a>
          </div>
        </div>
      `;
    }

    function updateQty(id) {
      const input = document.querySelector(`[data-qty-id="${id}"]`);
      updateCartQty(id, input.value);
      refreshCartBadge();
      render();
    }

    function removeItem(id) {
      removeFromCart(id);
      refreshCartBadge();
      render();
    }

    render();
  </script>
</body>
</html>
