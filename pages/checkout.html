<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — ShopEase</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">🛍️ Shop<span>Ease</span></a>
      <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="cart.html" class="cart-link">
          Cart
          <span class="cart-badge" data-cart-badge>0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Checkout</h1>
    <div id="formError" class="form-error"></div>
    <div id="checkoutContent"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 ShopEase — School Project Demo (HTML + CSS + JavaScript)</p>
    </div>
  </footer>

  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    const cartItems = getCartDetails();
    const container = document.getElementById("checkoutContent");

    if (cartItems.length === 0) {
      window.location.href = "cart.html";
    } else {
      const total = getCartTotal(cartItems);

      container.innerHTML = `
        <div class="checkout-wrap">
          <div class="form-card">
            <h2 style="margin-top:0;">Shipping & Payment Details</h2>
            <form id="checkoutForm">
              <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" required />
              </div>
              <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" required />
              </div>
              <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" />
              </div>
              <div class="form-group">
                <label for="address">Shipping Address *</label>
                <textarea id="address" rows="3" required></textarea>
              </div>
              <div class="form-group">
                <label for="payment">Payment Method</label>
                <select id="payment">
                  <option value="Cash on Delivery">Cash on Delivery</option>
                  <option value="Credit Card">Credit Card</option>
                  <option value="Bank Transfer">Bank Transfer</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary btn-block">Place Order</button>
            </form>
          </div>

          <div class="order-summary">
            <h2 style="margin-top:0; font-size: 1.1rem;">Order Summary</h2>
            ${cartItems
              .map(
                (item) => `
              <div class="mini-item-row">
                <span style="display:flex;align-items:center;gap:8px;"><img src="${item.image}" alt="" style="width:32px;height:32px;object-fit:cover;border-radius:6px;" /> ${item.name} x${item.qty}</span>
                <span>$${item.subtotal.toFixed(2)}</span>
              </div>`
              )
              .join("")}
            <div class="summary-total">
              <span>Total</span>
              <span>$${total.toFixed(2)}</span>
            </div>
          </div>
        </div>
      `;

      document.getElementById("checkoutForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const address = document.getElementById("address").value.trim();
        const payment = document.getElementById("payment").value;

        const errorBox = document.getElementById("formError");
        if (!name || !email || !address) {
          errorBox.textContent = "Please fill in all required fields (name, email, address).";
          errorBox.style.display = "block";
          return;
        }
        errorBox.style.display = "none";

        const orderId = "ORD-" + Math.random().toString(36).substring(2, 8).toUpperCase();
        const order = {
          orderId,
          date: new Date().toLocaleString(),
          customer: { name, email, phone, address },
          payment,
          items: cartItems,
          total
        };

        // Save just this one order so the invoice page can read it. Cleared after use.
        localStorage.setItem("shopease_last_order", JSON.stringify(order));
        clearCart();

        window.location.href = "invoice.html";
      });
    }
  </script>
</body>
</html>
